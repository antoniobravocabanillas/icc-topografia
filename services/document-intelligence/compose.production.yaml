name: terraqo-document-ai-production

services:
  gateway:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOCUMENT_AI_DOMAIN: "${DOCUMENT_AI_DOMAIN:?Define DOCUMENT_AI_DOMAIN}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge
      - private
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true

  extractor:
    build:
      context: .
    image: terraqo-document-intelligence:${DOCUMENT_AI_IMAGE_TAG:-1.0.0}
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      TERRAQO_DOCUMENT_AI_TOKEN: "${TERRAQO_DOCUMENT_AI_TOKEN:?Define TERRAQO_DOCUMENT_AI_TOKEN}"
      OLLAMA_BASE_URL: "http://ollama:11434"
      OLLAMA_CV_MODEL: "${OLLAMA_CV_MODEL:-qwen2.5:7b-instruct}"
      OLLAMA_TIMEOUT_SECONDS: "${OLLAMA_TIMEOUT_SECONDS:-720}"
    depends_on:
      model-init:
        condition: service_completed_successfully
    volumes:
      - document_ai_cache:/home/terraqo
    networks:
      - private
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  ollama:
    image: "${OLLAMA_IMAGE:-ollama/ollama:0.34.4}"
    restart: unless-stopped
    expose:
      - "11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - private
      - outbound
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s

  model-init:
    image: "${OLLAMA_IMAGE:-ollama/ollama:0.34.4}"
    restart: "no"
    environment:
      OLLAMA_HOST: "http://ollama:11434"
    entrypoint: ["/bin/sh", "-ec"]
    command: ["ollama pull ${OLLAMA_CV_MODEL:-qwen2.5:7b-instruct}"]
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - private
    security_opt:
      - no-new-privileges:true

networks:
  edge:
  private:
    internal: true
  outbound:

volumes:
  caddy_data:
  caddy_config:
  document_ai_cache:
  ollama_data:
